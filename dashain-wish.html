<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="HandheldFriendly" content="true">
    <meta name="MobileOptimized" content="width">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Happy Dashain 2082</title>
    <link rel="stylesheet" href="dashain-wish.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="main-title">Happy Dashain 2082</h1>
        <p class="subtitle">A Festival of Victory, Joy, and Blessings</p>
        <button class="wish-button" id="wishButton">✨ Reveal Dashain Wishes ✨</button>
        
        <!-- Viewer Name Popup -->
        <div class="name-popup" id="namePopup">
            <div class="popup-content">
                <h3>Enter Your Name</h3>
                <p>Please enter your name to receive personalized Dashain wishes</p>
                <input type="text" id="viewerName" placeholder="Your Name" style="width: 100%; height: auto; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 1rem; margin-bottom: 20px; box-sizing: border-box;">
                <button class="send-button" id="confirmNameButton">Continue</button>
            </div>
        </div>
        
        <div class="wish-content" id="wishContent">
            <div class="durga-container">
                <!-- Left side image - Dashain Tika and Jamara -->
                <img src="https://img.freepik.com/premium-photo/traditional-nepalese-dashain-tika-jamara-offerings-blessings-vijaya-dashami_999252-5714.jpg?w=2000" 
                     alt="Dashain Tika and Jamara" class="side-image left-image">
                
                <!-- Center Durga Mata image -->
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhbbrAHI269fEhcE3DQF-0u4UZFbm1c4e8Bb4NWJddmQRK3ck2RvI4X5ijGJ4B6lATOkxlOzHGsoWPoUx4Fg2DsM3LDq2uO_THX-mWxPDJghcjihWjCC60-G4CpT30GTxtiY8Z3HFGGNMUp/s1600/durgamatha-PNG-image1.png" 
                     alt="Durga Mata" class="durga-image" id="durgaImage">
                
                <!-- Right side image - Dashain Symbol -->
                <img src="pngegg.png" 
                     alt="Dashain Symbol" class="side-image right-image">
            </div>
            <div id="firstNepaliText" style="font-weight: bold; width: 100%; height: auto; margin: 5px 0; flex-grow: 1;"></div>
            
        </div>
        
        <!-- WhatsApp Reply Popup -->
        <div class="whatsapp-popup" id="whatsappPopup">
            <div class="popup-content">
                <span class="close-popup" id="closePopup">&times;</span>
                <h3>Send Your Dashain Blessings</h3>
                <p>Send your message directly to Karan Bohara via WhatsApp</p>
                <textarea id="whatsappMessage" placeholder="Type your Dashain blessings here..." style="width: 100%; height: 120px; box-sizing: border-box; resize: vertical;"></textarea>
                <button class="send-button" id="sendButton">Send via WhatsApp</button>
                <p style="font-size: 0.8rem; color: #666; margin-top: 10px;">Note: This will open WhatsApp to send your message</p>
            </div>
        </div>
    </div>
    
    <div class="youtube-player" id="youtubePlayer">
        <iframe id="youtubeIframe" width="200" height="100" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    <div class="music-toggle" id="musicToggle">🔇</div>

    <script src="dashain-wish.js"></script>
</body>
</html>
